<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OQULIX - Lead Management Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="navbar">
        <div class="logo">OQULIX<span>AI</span> Leads</div>
        <div class="stats">
            <span class="stat-badge hot-badge">🔥 <span id="hot-count">0</span> HOT</span>
            <span class="stat-badge">Total: <span id="total-count">0</span></span>
        </div>
    </header>

    <main class="dashboard">
        <!-- Leads List Panel -->
        <section class="leads-panel">
            <div class="panel-header">
                <h2>Recent Leads</h2>
                <div style="display: flex; gap: 10px;">
                    <button onclick="showBulkPanel()" class="refresh-btn" style="color: #10b981; font-weight: bold;">📣 Bulk Send</button>
                    <button onclick="fetchLeads()" class="refresh-btn">🔄 Refresh</button>
                </div>
            </div>
            <div class="leads-list" id="leads-list">
                <!-- Lead cards will be injected here -->
                <div class="loading">Loading leads...</div>
            </div>
        </section>

        <!-- Lead Detail Panel -->
        <section class="detail-panel" id="detail-panel" style="display: none;">
            <div class="detail-header">
                <div>
                    <button class="back-btn" onclick="goBack()">&#8592; Back</button>
                    <h2 id="detail-name">Customer Name</h2>
                    <p id="detail-phone">+91 0000000000</p>
                </div>
                <div class="badges" id="detail-badges">
                    <span class="status-badge HOT">HOT</span>
                </div>
            </div>
            
            <div class="info-grid">
                <div class="info-card">
                    <h3>Service</h3>
                    <p id="detail-service">-</p>
                </div>
                <div class="info-card">
                    <h3>Timeline</h3>
                    <p id="detail-timeline">-</p>
                </div>
                <div class="info-card">
                    <h3>Budget</h3>
                    <p id="detail-budget">-</p>
                </div>
                <div class="info-card">
                    <h3>Score</h3>
                    <p id="detail-score">0/100</p>
                </div>
            </div>
            
            <div class="requirements">
                <h3>Requirements</h3>
                <p id="detail-requirements">-</p>
            </div>

            <div class="conversation-section">
                <h3>WhatsApp Conversation</h3>
                <div class="chat-window" id="chat-window">
                    <!-- Chat bubbles injected here -->
                </div>
            </div>

            <div class="action-footer">
                <div style="display: flex; gap: 10px; width: 100%; align-items: stretch;">
                    <button id="ai-toggle-btn" class="primary-btn" onclick="toggleAi()" style="flex: 0 0 auto; white-space: nowrap; width: auto; background-color: #6b7280; min-width: 160px;">⏸ Pause AI (10m)</button>
                    <input type="text" id="admin-reply-input" placeholder="Type a message to send..." style="flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #d1d5db; background: white; color: #111827; font-size: 1rem; outline: none;">
                    <button class="primary-btn" onclick="sendAdminReply()" style="flex: 0 0 auto; background: #22c55e; white-space: nowrap; width: auto;">Send Message</button>
                </div>
            </div>
        </section>
        
        <!-- Bulk Send Panel -->
        <section class="detail-panel" id="bulk-panel" style="display: none; padding: 2rem; background: #f9fafb; align-items: center; justify-content: center;">
            <div style="width: 100%; max-width: 600px; background: white; padding: 2rem; border-radius: 8px; border: 1px solid #e5e7eb; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);">
                <h2 style="margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: center;">
                    📣 Bulk Broadcast
                    <button onclick="hideBulkPanel()" style="background: none; border: none; cursor: pointer; color: #6b7280; font-size: 1.2rem;">✖</button>
                </h2>
                
                <div style="margin-bottom: 1rem;">
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Template Name</label>
                    <input type="text" id="bulk-template" placeholder="e.g. hello_testing_" style="width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 4px; outline: none; font-size: 1rem;">
                    <small style="color: #6b7280;">The exact name of your approved Meta template.</small>
                </div>
                
                <div style="margin-bottom: 1rem;">
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Language Code</label>
                    <input type="text" id="bulk-language" value="en" placeholder="e.g. en or en_US" style="width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 4px; outline: none; font-size: 1rem;">
                </div>

                <div style="margin-bottom: 1.5rem;">
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Phone Numbers</label>
                    <textarea id="bulk-numbers" rows="8" placeholder="Paste phone numbers here...&#10;One number per line&#10;Include country code (e.g. 919876543210)" style="width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 4px; outline: none; resize: vertical; font-size: 1rem;"></textarea>
                </div>

                <button id="bulk-send-btn" class="primary-btn" onclick="sendBulkBroadcast()" style="width: 100%; background-color: #10b981; font-size: 1.1rem; padding: 12px;">🚀 Send Broadcast</button>
                
                <div id="bulk-status" style="margin-top: 1rem; padding: 1rem; border-radius: 4px; display: none; background: #f3f4f6;"></div>
            </div>
        </section>

        <div id="empty-state" class="empty-state">
            <p>Select a lead to view details.</p>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
