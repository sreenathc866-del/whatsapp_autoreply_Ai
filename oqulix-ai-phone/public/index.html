<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oqulix AI Voice Assistant</title>
  <style>
    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --success: #22c55e;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 2rem;
    }

    .container {
      background-color: var(--card-bg);
      border-radius: 1rem;
      padding: 2rem;
      width: 100%;
      max-width: 600px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      text-align: center;
    }

    .status-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 2rem;
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: var(--danger);
      transition: background-color 0.3s ease;
    }

    .status-dot.connected {
      background-color: var(--success);
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    button {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 0.5rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 1rem;
    }

    #startBtn {
      background-color: var(--primary);
      color: white;
    }

    #startBtn:hover:not(:disabled) {
      background-color: var(--primary-dark);
      transform: translateY(-1px);
    }

    #startBtn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #stopBtn {
      background-color: transparent;
      color: var(--text);
      border: 1px solid var(--text-muted);
      display: none;
    }

    #stopBtn:hover {
      background-color: rgba(255, 255, 255, 0.05);
    }

    .visualizer-container {
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      margin-bottom: 2rem;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .visualizer-container.active {
      opacity: 1;
    }

    .bar {
      width: 4px;
      height: 10px;
      background-color: var(--primary);
      border-radius: 2px;
      transition: height 0.1s ease;
    }

    .chat-box {
      background-color: rgba(0, 0, 0, 0.2);
      border-radius: 0.5rem;
      padding: 1rem;
      min-height: 200px;
      max-height: 400px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .message {
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      max-width: 85%;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      align-self: flex-end;
      background-color: var(--primary);
    }

    .message.ai {
      align-self: flex-start;
      background-color: #334155;
    }

    .message-label {
      font-size: 0.75rem;
      opacity: 0.7;
      margin-bottom: 0.25rem;
    }
    .input-form {
      display: flex;
      gap: 0.5rem;
      margin-top: 1rem;
    }

    .input-form input {
      flex: 1;
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      border: 1px solid var(--text-muted);
      background-color: rgba(0, 0, 0, 0.3);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .input-form input:focus {
      border-color: var(--primary);
    }

    .input-form button {
      background-color: var(--primary);
      color: white;
      padding: 0.75rem 1.25rem;
      border: none;
      border-radius: 0.5rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .input-form button:hover:not(:disabled) {
      background-color: var(--primary-dark);
    }

    .input-form button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Oqulix Voice Assistant</h1>
    <div class="status-bar">
      <div id="connectionStatus" class="status-dot"></div>
      <span id="statusText">Connecting...</span>
    </div>

    <div class="controls">
      <button id="startBtn">Start Conversation</button>
      <button id="stopBtn">Stop</button>
    </div>

    <div class="visualizer-container" id="visualizer">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </div>

    <div class="chat-box" id="chatBox">
      <!-- Chat messages will appear here -->
    </div>

    <form class="input-form" id="inputForm">
      <input type="text" id="textInput" placeholder="Type a message or question..." autocomplete="off" />
      <button type="submit" id="sendBtn">Send</button>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
